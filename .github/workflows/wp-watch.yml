name: WordPress version watch

on:
  schedule:
    - cron: '0 7 * * *'   # daily, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write          # required to dispatch the bump workflow

jobs:
  watch:
    uses: Laserology/wp-plugin-workflows/.github/workflows/wp-watch-shared.yml@v1
    with:
      readme-paths: |
        readme.txt
      bump-workflow: opencode-bump.yml
