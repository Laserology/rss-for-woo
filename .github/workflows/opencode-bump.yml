name: OpenCode bump

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target WordPress major.minor
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    uses: Laserology/wp-plugin-workflows/.github/workflows/opencode-bump-shared.yml@v1
    with:
      target: ${{ github.event.inputs.target || '' }}
      plugin-paths: |
        .
      readme-paths: |
        readme.txt
    secrets: inherit
